name: Build cap-web (DigitalSoul)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/build-web-digitalsoul.yml"
  workflow_dispatch:
    inputs:
      redeploy:
        description: "Restart the Coolify service after the push"
        type: boolean
        default: true

concurrency:
  group: build-web-digitalsoul
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/krispheria/cap-web

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome on the files that differ from upstream
        run: |
          git remote add upstream https://github.com/CapSoftware/Cap.git
          git fetch --no-tags upstream main
          BASE=$(git merge-base HEAD upstream/main)
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' '*.json' | grep -v '^apps/desktop/' | grep -v '^packages/database/migrations/' || true)
          if [ -z "$FILES" ]; then echo "No TypeScript changes vs upstream"; exit 0; fi
          echo "$FILES"
          pnpm exec biome check $FILES
      - name: Web tests
        run: pnpm --filter @cap/web exec vitest run --exclude "**/slack-app-manifest.test.ts"

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Write build env
        run: |
          echo "NEXT_PUBLIC_DOCKER_BUILD=true" > .env
          echo "WEB_URL=https://grabador.digitalsoulia.com" >> .env
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Restart the Coolify service
        if: ${{ github.event_name == 'push' || inputs.redeploy }}
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_SERVICE_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_SERVICE_UUID" ]; then
            echo "Coolify secrets not configured; skipping restart"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "${COOLIFY_URL%/}/api/v1/services/$COOLIFY_SERVICE_UUID/restart?latest=true"
